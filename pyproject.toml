[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isas-pool-tests"
version = "0.1.0"
description = "Guarded ArduSub pool-test and competition-video tools"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
vehicle = [
  "pymavlink>=2.4.41",
  "pyserial>=3.5",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
